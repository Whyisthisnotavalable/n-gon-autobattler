<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>auto-gon</title>
<style>
  :root {
    --bg: #f4f5f7;
    --panel: #ffffff;
    --ink: #2b2e33;
    --sub: #767c87;
    --line: #e2e4e8;
    --accent: #333;
    --team-a: #e6473d;
    --team-b: #3d7fe6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    overflow: hidden;
  }
  #app { display: flex; height: 100vh; width: 100vw; }

  #sidebar {
    width: 300px; min-width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    padding: 16px 16px 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: row;
    justify-content: space-between;
  }
  #sidebar-header h1 {
    font-size: 16px; margin: 0 0 2px 0; font-weight: 700; letter-spacing: 0.2px;
  }
  #sidebar-header p { margin: 0; font-size: 12px; color: var(--sub); }
  #fps-select {
    padding: 8px 8px 12px 8px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  #fps-select > label {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    font-size: 0.8em;
  }
  #fps-select > label > span:first-child {
    width: 90px; 
  }
  #fps-select > label > input[type="range"] {
    flex: 1; 
  }
  #fps-select > label > span:last-child {
    width: 35px; 
    text-align: right;
  }
  select {
    font-size: 0.8em;
    border: 1px #333 solid;
    border-radius: 6px;
    color: #000;
    cursor: pointer;
    margin-bottom: 5px;
  }
  .sidebar-toggle {
    padding: 1px 10px;
    border: none;
    background: #eceef1;
    color: var(--ink);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.05s ease, background 0.15s ease;
  }
  .sidebar-toggle:hover {
    background: #e2e4e8;
  }
  .sidebar-toggle:active {
    transform: scale(0.97);
  }
  #show-btn {
    display: none;
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 999;
  }
  #team-row { display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .team-btn {
    flex: 1; padding: 8px 0; border: 2px solid transparent;
    font-weight: 600; font-size: 13px; cursor: pointer; background: #f0f1f3; color: var(--ink);
    transition: transform 0.05s ease;
  }
  .team-btn:active { transform: scale(0.97); }
  #team-a-btn.selected { background: rgba(230,71,61,0.12); border-color: var(--team-a); color: var(--team-a); }
  #team-b-btn.selected { background: rgba(61,127,230,0.12); border-color: var(--team-b); color: var(--team-b); }

  #selected-mob-row { padding: 8px 16px; font-size: 12px; color: var(--sub); border-bottom: 1px solid var(--line); }
  #selected-mob-label { color: var(--ink); font-weight: 600; }

  #roster { flex: 1; overflow-y: auto; padding: 8px 12px 16px 12px; }
  .roster-section-title {
    font-size: 11px; letter-spacing: 0.6px;
    color: var(--sub); font-weight: 700; margin: 14px 4px 4px 4px;
  }
  .roster-tier-title { font-size: 11px; color: #9aa0aa; margin: 8px 4px 4px 4px; }
  .roster-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 2px; }
  .mob-btn {
    border: 1px solid var(--line); background: #fafafa; color: var(--ink);
    padding: 5px 9px; font-size: 12px; cursor: pointer;
    white-space: nowrap;
  }
  .mob-btn:hover { background: #f0f1f3; }
  .mob-btn.selected { background: var(--accent); color: #fff; border-color: var(--accent); }

  #controls { padding: 12px 16px 16px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  #controls button {
    flex: 1; padding: 10px 0; border: none;
    font-weight: 700; font-size: 14px; cursor: pointer;
  }
  #fight-btn { background: #22242a; color: #fff; }
  #fight-btn:hover { background: #34363d; }
  #reset-btn { background: #eceef1; color: var(--ink); }
  #reset-btn:hover { background: #e2e4e8; }
  #show-btn {
    display: none;
    position: absolute;
    top: 3em; 
    left: 1em;
    z-index: 999;
  }
  #canvas-wrap { flex: 1; position: relative; background: #fbfbfc; }
  #canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
</style>
</head>

    <div id="sidebar">

<script src='matter.min.js'></script>
<script>

const Engine = Matter.Engine,
    Events = Matter.Events,
    Composites = Matter.Composites,
    Composite = Matter.Composite,
    Constraint = Matter.Constraint,
    Vertices = Matter.Vertices,
    Query = Matter.Query,
    Body = Matter.Body,
    Bodies = Matter.Bodies,
    Vector = Matter.Vector;

let body = []; 
let map = [];  
let cons = []; 
let consBB = []; 
let bullet = []; 
let powerUp = []; 

const cat = {
    player: 0x1,
    map: 0x10,
    body: 0x100,
    bullet: 0x1000,
    powerUp: 0x10000,
    mob: 0x100000,
    mobBullet: 0x1000000,
    mobShield: 0x10000000,
    phased: 0x100000000,
}

let color = {
    block: "rgba(140,140,140,0.85)",
    blockS: "#222",
    map: "#444",
    bullet: "#000"
}

const tech = {
    botSpawner: 0,
    cloakDuplication: 0,
    collidePowerUps: false,
    conchoidalDamage: 1,
    damageAdjustments() { return 1 },
    deathSpawns: 0,
    deathSpawnsFromBoss: 0,
    duplicationChance: 0,
    energySiphon: 0,
    extraMaxHealth: 0,
    healMaxEnergyBonus: 0,
    healSpawn: 0,
    iceIXOnDeath: 0,
    isAddRemoveMaxHealth: false,
    isAoESlow: false,
    isBarycenter: false,
    isBotSpawnerReset: false,
    isChatter: false,
    isChitin: false,
    isConchoidal: false,
    isDarkEnergy: false,
    isDarkStar: false,
    isDemineralize: false,
    isDuplicateMobs: false,
    isEnergyHealth: false,
    isEnergyLoss: false,
    isExplodeMob: false,
    isFarAwayDmg: false,
    isHarmDarkMatter: false,
    isIceKill: false,
    isIceMaxHealthLoss: false,
    isImmortal: false,
    isIntangible: false,
    isMobBlockFling: false,
    isMobDeathImmunity: false,
    isMobFullHealthCloak: false,
    isMobLowHealth: false,
    isMoveDarkMatter: false,
    isNotDarkMatter: false,
    isRadioactive: false,
    isRadioactiveResistance: false,
    isRemineralize: false,
    isShieldAmmo: false,
    isSporeFlea: false,
    isSporeWorm: false,
    isSuperDeterminism: false,
    isVerlet: false,
    mineralDamage: 1,
    mineralDamageReduction: 0,
    mineralLastCheck: 0,
    mobSpawnWithHealth: 0, 
    nailsDeathMob: 0,
    radioactiveDamage: 1,
    sporesOnDeath: 0,
    wimpCount: 0,
    wire: { segments: [] },
};

const level = {
    levelsCleared: 0, 
    isReducedRegen: 1,
    isMobDeathHeal: false,
    isMobRespawn: false,
    isMobShields: false,
    exit: { x: 0, y: 0 },
    levels: [],
    inGameText() { },
    newLevelOrPhase() { },
    laser(p1, p2) {
        const midX = (p1.x + p2.x) / 2, midY = (p1.y + p2.y) / 2;
        const len = Math.max(1, Math.hypot(p2.x - p1.x, p2.y - p1.y));
        const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
        const seg = Bodies.rectangle(midX, midY, len, 4, {
            isStatic: true,
            angle,
            isSensor: true,
            collisionFilter: { group: 0, category: cat.map, mask: 0 },
        });
        map.push(seg);
        Composite.add(engine.world, seg);
        return seg;
    },
    custom() { },
    customTopLayer() { },
};

const localSettings = {
    isHideHUD: false,          
    difficultyCompleted: {},
};
const lore = { techCount: 0, techGoal: 999 }; 
const input = { down: false, up: false, left: false, right: false, fire: false };

const b = {
    inventory: [], guns: {}, 
    orbitBot() { }, worm() { }, flea() { }, spore() { }, explosion() { },
    targetedNail() { }, randomBot() { }, iceIX() { }, targetedBlock() { },
};

const powerUps = {
    randomize() { },
    spawn() { },
    spawnRandomPowerUp() { },
    spawnBossPowerUp() { },
    ejectTech() { },
    ejectGraphic() { },
    chooseRandomPowerUp() { },
    directSpawn() { },
    setPowerUpMode() { },
    do() { },
};
const engine = Engine.create();
engine.world.gravity.scale = 0; 
engine.constraintIterations = 1;
const invinciblilityFrames = 5; 
const minCdamage = 0.05, maxCdamage = 1;
const blockDmgScale = 0.02; 
function enforceDefaultTiers() {
    for (let i = 0; i < mob.length; i++) {
        const me = mob[i];
        if (me.tier === undefined) me.tier = me.isBoss ? 4 : 1;
    }
}
const _originalCanCollide = Matter.Detector.canCollide;
Matter.Detector.canCollide = function (filterA, filterB) {
    if (filterA.team && filterB.team && filterA.team === filterB.team && (filterA.avoidOwnTeam || filterB.avoidOwnTeam)) {
        return false;
    }
    return _originalCanCollide(filterA, filterB);
};

function enforceCollisionMasks() {
    const need = cat.mob | cat.mobBullet | cat.mobShield;
    for (let i = 0; i < mob.length; i++) {
        const me = mob[i];
        const cf = me.collisionFilter;
        if (!cf || cf.category === 0) continue;
        if (me._originallyCollidedWithMobs === undefined) {
            me._originallyCollidedWithMobs = !!(cf.mask & cat.mob);
        }
        cf.team = me.team;
        cf.avoidOwnTeam = !me._originallyCollidedWithMobs;
        cf.mask |= need;
    }
}

function isImmune(who) {
    return !!(who.immuneUntilCycle && who.immuneUntilCycle > simulation.cycle);
}
function setImmune(who) {
    who.immuneUntilCycle = simulation.cycle + invinciblilityFrames;
}
function applyMobContact(attacker, defender) {
    if (!attacker.alive || !defender.alive) return;
    if (attacker.isSlowed || attacker.isStunned) return;
    if (isImmune(defender)) return;
    pointGlobalsAt(defender);
    const dmg = Math.min(Math.max(simulation.dmgScale * Math.sqrt(attacker.mass), minCdamage), maxCdamage) * attacker.damageScale();
    defender.damage(dmg);
    if (defender.alive) {
        defender.seePlayer.yes = true;
        defender.seePlayer.recall = defender.memory + Math.round(defender.memory * Math.random());
        defender.seePlayer.position.x = attacker.position.x;
        defender.seePlayer.position.y = attacker.position.y;
    }
    if (defender.damageReduction) {
        simulation.drawList.push({ x: defender.position.x, y: defender.position.y, radius: Math.log(dmg + 1.1) * 40 * defender.damageReduction + 3, color: simulation.mobDmgColor, time: simulation.drawTime });
    }
    if (attacker.onHit) attacker.onHit();
    setImmune(defender);
}
function handleMobVsMob(mobA, mobB) {
    if (mobA.team === mobB.team) return;
    applyMobContact(mobA, mobB);
    applyMobContact(mobB, mobA);
    if (mobA.alive && mobB.alive) {
        const angle = Math.atan2(mobA.position.y - mobB.position.y, mobA.position.x - mobB.position.x);
        const KICK = 3;
        Body.setVelocity(mobA, { x: mobA.velocity.x + KICK * Math.cos(angle), y: mobA.velocity.y + KICK * Math.sin(angle) });
        Body.setVelocity(mobB, { x: mobB.velocity.x - KICK * Math.cos(angle), y: mobB.velocity.y - KICK * Math.sin(angle) });
    }
}
function handleMobVsBody(who, obj) {
    if (obj.speed <= 9 || !who.alive) return;
    const v = Vector.magnitude(Vector.sub(who.velocity, obj.velocity));
    if (v <= 11) return;
    const dmg = blockDmgScale * v * obj.mass;
    who.damage(dmg, true);
    const stunTime = dmg / Math.sqrt(obj.mass);
    if (stunTime > 0.5 && who.memory !== Infinity) mobs.statusStun(who, 60 + 60 * Math.sqrt(stunTime));
    if (who.damageReduction) {
        simulation.drawList.push({ x: who.position.x, y: who.position.y, radius: Math.log(dmg + 1.1) * 40 * who.damageReduction + 3, color: simulation.playerDmgColor, time: simulation.drawTime });
    }
}
function collisionChecks(event) {
    const pairs = event.pairs;
    for (let i = 0, len = pairs.length; i < len; i++) {
        const a = pairs[i].bodyA, b = pairs[i].bodyB;
        if (a.mob && b.mob) {
            handleMobVsMob(a, b);
        } else if (a.mob && b.classType === "body") {
            handleMobVsBody(a, b);
        } else if (b.mob && a.classType === "body") {
            handleMobVsBody(b, a);
        }
    }
}
Events.on(engine, "collisionStart", function (event) {
    collisionChecks(event);
});
Events.on(engine, "collisionActive", function (event) {
    collisionChecks(event);
});

const simulation = {
    cycle: 0,
    delta: 1000 / 60,
    g: 0.0024,
    accelScale: 1,
    difficulty: 1,
    difficultyMode: 1,
    CDScale: 1,
    drawTime: 8,
    mobDmgColor: "rgba(255,0,0,0.7)",
    playerDmgColor: "rgba(0,0,0,0.7)",
    paused: false,
    isChoosing: false,
    isTimeSkipping: false,
    isCheating: false,
    isHorizontalFlipped: false,
    isInvertedVertical: false,
    onTitlePage: false,
    testing: false,
    analysis: 0,
    fps: 60,
    fpsInterval: 1000 / 60,
    then: performance.now(),
    dmgScale: 0.025,
    camera() { },              
    checks() { },
    clearMap() { },
    loop() { },                
    timePlayerSkip() { },      
    splashReturn() { },
    inGameConsole() { },       
    updateGunHUD() { },
    drawList: [], 
    drawCircle() {
        let i = simulation.drawList.length;
        while (i--) {
            const d = simulation.drawList[i];
            ctx.beginPath();
            ctx.arc(d.x, d.y, d.radius, 0, 2 * Math.PI);
            ctx.fillStyle = d.color;
            ctx.fill();
            if (d.time) {
                d.time--;
            } else {
                simulation.drawList.splice(i, 1);
            }
        }
    },

    ephemera: [], 
    removeEphemera(who) {
        const i = simulation.ephemera.indexOf(who);
        if (i !== -1) simulation.ephemera.splice(i, 1);
    },
    runEphemera() {
        for (let i = 0; i < simulation.ephemera.length; i++) simulation.ephemera[i].do();
    },

    energyGenGraphic() { }, 

    gravity() {
        for (let i = 0, len = body.length; i < len; i++) {
            body[i].force.y += body[i].mass * simulation.g;
        }
    },

    wipe() {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    },

    checkLineIntersection(v1, v1End, v2, v2End) {
        let result = { x: null, y: null, onLine1: false, onLine2: false };
        const denominator = (v2End.y - v2.y) * (v1End.x - v1.x) - (v2End.x - v2.x) * (v1End.y - v1.y);
        if (denominator === 0) return result;
        const a0 = v1.y - v2.y, b0 = v1.x - v2.x;
        const numerator1 = (v2End.x - v2.x) * a0 - (v2End.y - v2.y) * b0;
        const numerator2 = (v1End.x - v1.x) * a0 - (v1End.y - v1.y) * b0;
        const a = numerator1 / denominator, b = numerator2 / denominator;
        result.x = v1.x + a * (v1End.x - v1.x);
        result.y = v1.y + a * (v1End.y - v1.y);
        if (a > 0 && a < 1) result.onLine1 = true;
        if (b > 0 && b < 1) result.onLine2 = true;
        return result;
    },

    draw: {
        bodyDefault() {
            ctx.beginPath();
            for (let i = 0, len = body.length; i < len; i++) {
                const vertices = body[i].vertices;
                ctx.moveTo(vertices[0].x, vertices[0].y);
                for (let j = 1; j < vertices.length; j++) ctx.lineTo(vertices[j].x, vertices[j].y);
                ctx.lineTo(vertices[0].x, vertices[0].y);
            }
            ctx.lineWidth = 2;
            ctx.fillStyle = color.block;
            ctx.fill();
            ctx.strokeStyle = color.blockS;
            ctx.stroke();
        },
        body() { simulation.draw.bodyDefault() },
        cons() {
            ctx.beginPath();
            for (let i = 0, len = cons.length; i < len; i++) {
                ctx.moveTo(cons[i].pointA.x, cons[i].pointA.y);
                ctx.lineTo(cons[i].bodyB.position.x + cons[i].pointB.x, cons[i].bodyB.position.y + cons[i].pointB.y);
            }
            for (let i = 0, len = consBB.length; i < len; i++) {
                ctx.moveTo(consBB[i].bodyA.position.x, consBB[i].bodyA.position.y);
                ctx.lineTo(consBB[i].bodyB.position.x, consBB[i].bodyB.position.y);
            }
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(0,0,0,0.15)";
            ctx.stroke();
        },
    },
};

function vertexCollision(v1, v1End, domains) {
    let best = { x: null, y: null, dist2: Infinity, who: null, v1: null, v2: null };
    for (let j = 0; j < domains.length; j++) {
        let domain = domains[j];

        const isPlayerRefDomain = domain.length > 0 && domain.length <= 2 &&
            domain.every(b => b === playerBody || b === playerHead);
        if (isPlayerRefDomain && currentActingMob) {
            domain = livingEnemiesOf(currentActingMob.team);
        }

        for (let i = 0; i < domain.length; i++) {
            const vertices = domain[i].vertices;
            const len = vertices.length - 1;
            for (let k = 0; k < len; k++) {
                const r = simulation.checkLineIntersection(v1, v1End, vertices[k], vertices[k + 1]);
                if (r.onLine1 && r.onLine2) {
                    const dx = v1.x - r.x, dy = v1.y - r.y, dist2 = dx * dx + dy * dy;
                    if (dist2 < best.dist2 && (!domain[i].mob || domain[i].alive)) {
                        best = { x: r.x, y: r.y, dist2, who: domain[i], v1: vertices[k], v2: vertices[k + 1] };
                    }
                }
            }
            const r = simulation.checkLineIntersection(v1, v1End, vertices[0], vertices[len]);
            if (r.onLine1 && r.onLine2) {
                const dx = v1.x - r.x, dy = v1.y - r.y, dist2 = dx * dx + dy * dy;
                if (dist2 < best.dist2) best = { x: r.x, y: r.y, dist2, who: domain[i], v1: vertices[0], v2: vertices[len] };
            }
        }
    }
    if (best.who && best.who.mob && currentActingMob && best.who.team !== currentActingMob.team) {
        pointGlobalsAt(best.who);
    }
    return best;
}



const ARENA = { width: 3200, height: 2000 };
const WALL = 240;

function buildArena() {
    const w = ARENA.width, h = ARENA.height, t = WALL;
    const walls = [
        Bodies.rectangle(w / 2, h + t / 2, w + t * 2, t, { isStatic: true }),   
        Bodies.rectangle(w / 2, -t / 2, w + t * 2, t, { isStatic: true }),     
        Bodies.rectangle(-t / 2, h / 2, t, h + t * 2, { isStatic: true }),     
        Bodies.rectangle(w + t / 2, h / 2, t, h + t * 2, { isStatic: true }),  
    ];
    for (const wall of walls) {
        wall.collisionFilter.category = cat.map;
        wall.collisionFilter.mask = cat.player | cat.body | cat.bullet | cat.mob | cat.mobBullet;
        map.push(wall);
        Composite.add(engine.world, wall);
    }
}

function drawArena() {
    ctx.beginPath();
    for (let i = 0; i < map.length; i++) {
        const vertices = map[i].vertices;
        ctx.moveTo(vertices[0].x, vertices[0].y);
        for (let j = 1; j < vertices.length; j++) ctx.lineTo(vertices[j].x, vertices[j].y);
        ctx.lineTo(vertices[0].x, vertices[0].y);
    }
    ctx.fillStyle = color.map;
    ctx.fill();
}

let cameraScale = 1, cameraOffsetX = 0, cameraOffsetY = 0;
function updateCameraFit() {
    const margin = 60;
    const sx = (canvas.width - margin * 2) / ARENA.width;
    const sy = (canvas.height - margin * 2) / ARENA.height;
    cameraScale = Math.min(sx, sy);
    cameraOffsetX = (canvas.width - ARENA.width * cameraScale) / 2;
    cameraOffsetY = (canvas.height - ARENA.height * cameraScale) / 2;
}
function applyCameraTransform() {
    ctx.setTransform(cameraScale, 0, 0, cameraScale, cameraOffsetX, cameraOffsetY);
}
function screenToArena(px, py) {
    return { x: (px - cameraOffsetX) / cameraScale, y: (py - cameraOffsetY) / cameraScale };
}


let mob = [];
const mobs = {
    loop() {
        let i = mob.length;
        while (i--) {
            if (mob[i].alive) {
                mob[i].do();
            } else {
                mob[i].replace(i); 
            }
        }
    },
    draw() { },
    drawDefault() {
        ctx.lineWidth = 2;
        let i = mob.length;
        while (i--) {
            ctx.beginPath();
            const vertices = mob[i].vertices;
            ctx.moveTo(vertices[0].x, vertices[0].y);
            for (let j = 1, len = vertices.length; j < len; ++j) ctx.lineTo(vertices[j].x, vertices[j].y);
            ctx.lineTo(vertices[0].x, vertices[0].y);
            ctx.fillStyle = mob[i].fill;
            ctx.strokeStyle = mob[i].stroke;
            ctx.fill();
            ctx.stroke();
        }
    },
    statusSlow(who, cycles = 60) {
        applySlow(who)
        if (tech.isAoESlow) {
            const range2 = (200 + 170 * Math.random()) ** 2
            for (let i = 0, len = mob.length; i < len; i++) {
                if (who !== mob[i] && Vector.magnitudeSquared(Vector.sub(who.position, mob[i].position)) < range2 + mob[i].radius) applySlow(mob[i])
            }
            simulation.drawList.push({
                x: who.position.x,
                y: who.position.y,
                radius: Math.sqrt(range2),
                color: "rgba(0,100,255,0.05)",
                time: simulation.drawTime
            });
        }

        function applySlow(whom) {
            if (!whom.shield && !whom.isShielded && whom.alive) {
                if (tech.isIceMaxHealthLoss && whom.health > 0.66 && whom.damageReduction > 0) whom.health = 0.66
                if (tech.isIceKill && whom.health < 0.34 && whom.damageReduction > 0 && whom.alive) {
                    whom.damage(Infinity)
                    simulation.drawList.push({
                        x: whom.position.x,
                        y: whom.position.y,
                        radius: whom.radius * 1.2,
                        color: "rgb(0,100,255)",
                        time: 8
                    });
                    simulation.drawList.push({
                        x: whom.position.x,
                        y: whom.position.y,
                        radius: whom.radius * 0.7,
                        color: "rgb(0,100,255)",
                        time: 12
                    });
                    simulation.drawList.push({
                        x: whom.position.x,
                        y: whom.position.y,
                        radius: whom.radius * 0.4,
                        color: "rgb(0,100,255)",
                        time: 16
                    });
                }
                if (whom.isBoss) cycles = Math.floor(cycles * 0.25)
                let i = whom.status.length
                while (i--) {
                    if (whom.status[i].type === "slow") whom.status.splice(i, 1); 
                }
                whom.isSlowed = true;
                whom.status.push({
                    effect() {
                        if (whom.speed > 1) {
                            const drag = 0.94
                            Matter.Body.setVelocity(whom, {
                                x: whom.velocity.x * drag,
                                y: whom.velocity.y * drag
                            });
                        }
                        Matter.Body.setAngularVelocity(whom, 0);
                        ctx.beginPath();
                        ctx.moveTo(whom.vertices[0].x, whom.vertices[0].y);
                        for (let j = 1, len = whom.vertices.length; j < len; ++j) {
                            ctx.lineTo(whom.vertices[j].x, whom.vertices[j].y);
                        }
                        ctx.lineTo(whom.vertices[0].x, whom.vertices[0].y);
                        ctx.strokeStyle = "rgba(0,100,255,0.8)";
                        ctx.lineWidth = 15;
                        ctx.stroke();
                        ctx.fillStyle = whom.fill
                        ctx.fill();
                    },
                    endEffect() {
                        whom.isSlowed = false;
                    },
                    type: "slow",
                    endCycle: simulation.cycle + cycles,
                })
            }
        }
    },
    statusStun(who, cycles = 180) {
        if (!who.shield && !who.isShielded) {
            if (who.speed > 3) {
                Matter.Body.setVelocity(who, {
                    x: who.velocity.x * 0.8,
                    y: who.velocity.y * 0.8
                });
            }
            Matter.Body.setAngularVelocity(who, who.angularVelocity * 0.8);
            let i = who.status.length
            while (i--) {
                if (who.status[i].type === "stun") who.status.splice(i, 1);
            }
            who.isStunned = true;
            who.status.push({
                effect() {
                    if (who.memory !== Infinity) {
                        who.seePlayer.yes = false;
                        who.seePlayer.recall = 0;
                        who.seePlayer.position = {
                            x: who.position.x + 100 * (Math.random() - 0.5),
                            y: who.position.y + 100 * (Math.random() - 0.5)
                        }
                    } else {
                        Matter.Body.setVelocity(who, {
                            x: who.velocity.x * 0.6,
                            y: who.velocity.y * 0.6
                        });
                    }
                    if (who.velocity.y < 2) who.force.y += who.mass * 0.0004 

                    ctx.fillStyle = `rgba(${Math.floor(255 * Math.random())},${Math.floor(255 * Math.random())},${Math.floor(255 * Math.random())},0.5)`

                    ctx.beginPath();
                    ctx.moveTo(who.vertices[0].x, who.vertices[0].y);
                    for (let j = 1, len = who.vertices.length; j < len; ++j) {
                        ctx.lineTo(who.vertices[j].x, who.vertices[j].y);
                    }
                    ctx.lineTo(who.vertices[0].x, who.vertices[0].y);
                    ctx.fill();
                },
                endEffect() {
                    who.isStunned = false
                },
                type: "stun",
                endCycle: simulation.cycle + cycles * (who.isBoss ? 0.2 : 1),
            })
        }
    },
    statusDoT(who, tickDamage, cycles = 180) {
        if (!who.isShielded && who.alive && who.damageReduction > 0) {
            who.status.push({
                effect() {
                    if ((simulation.cycle - this.startCycle) % 30 === 0) {
                        let dmg = tech.radioactiveDamage * this.dmg
                        who.damage(dmg);
                        if (who.damageReduction) {
                            simulation.drawList.push({ 
                                x: who.position.x + (Math.random() - 0.5) * who.radius * 0.5,
                                y: who.position.y + (Math.random() - 0.5) * who.radius * 0.5,
                                radius: Math.log(dmg + 1.1) * 40 * who.damageReduction + 3,
                                color: "rgba(0,80,80,0.9)",
                                time: simulation.drawTime
                            });
                        }
                    }
                },
                endEffect() { },
                dmg: tickDamage,
                type: "dot",
                endCycle: simulation.cycle + cycles,
                startCycle: simulation.cycle + 29 
            })
        }
    },
    deathCount: 0,
    mobSpawnWithHealth: 1,
    setMobSpawnHealth() {
        mobs.mobSpawnWithHealth = 0.88 ** (tech.mobSpawnWithHealth)
    },
    spawn(xPos, yPos, sides, radius, color) {
        let i = mob.length;

            mob: true,
            density: 0.001,
            frictionAir: 0.005,
            restitution: 0.5,
            collisionFilter: {
                group: 0,
                category: cat.mob,
                mask: cat.player | cat.map | cat.body | cat.bullet | cat.mob
            },
            onHit: undefined,
            alive: true,
            index: i,
            health: mobs.mobSpawnWithHealth,
            accelMag: 0.001 * simulation.accelScale,
            cd: 0, 
            delay: 60, 
            fill: color,
            stroke: "#000",
            seePlayer: {
                yes: false,
                recall: 0,
                position: {
                    x: xPos,
                    y: yPos
                }
            },
            radius: radius,
            spawnPos: {
                x: xPos,
                y: yPos
            },
            healthBar1() {
                const h = this.radius * 0.3;
                const w = this.radius * 2;
                const x = this.position.x - w / 2;
                const y = this.position.y - w * 0.7;
                ctx.fillStyle = "rgba(100, 100, 100, 0.3)";
                ctx.fillRect(x, y, w, h);
                ctx.fillStyle = "rgba(255,0,0,0.7)";
                ctx.fillRect(x, y, w * this.health, h);
            },
            healthBar2() {
                const x1 = this.position.x - this.radius
                const x2 = this.position.x + this.radius
                const y = this.position.y - this.radius
                ctx.lineWidth = this.radius * 0.27;

                ctx.beginPath()
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y)
                ctx.strokeStyle = "rgba(100, 100, 100, 0.3)";
                ctx.stroke()

                ctx.beginPath()
                ctx.moveTo(x1, y);
                ctx.lineTo(x1 + 2 * this.radius * this.health, y)
                ctx.strokeStyle = "rgba(255, 0, 100, 0.8)";
                ctx.stroke()
            },
            healthBar3() {
                const arc = 3 / 2 * Math.PI
                ctx.lineWidth = this.radius * 0.25;
                ctx.strokeStyle = `rgb(${Math.floor(150 + 50 * Math.random())},0,${Math.floor(150 + 50 * Math.random())})`;

                ctx.beginPath()
                ctx.arc(this.position.x, this.position.y, this.radius * 1.5, arc - this.health, arc + this.health,);
                ctx.stroke()
            },
            healthBar4() {
                const w = this.radius * 0.43;
                const x = this.position.x - this.radius;
                const y = this.position.y - this.radius * 1.4;
                ctx.fillStyle = "rgba(100, 100, 100, 0.3)";
                ctx.fillRect(x, y, this.radius * 2, w);
                let health
                if (this.health > 0.5) {
                    ctx.fillStyle = "#000";
                    health = 2 * (this.health - 0.5)
                } else {
                    ctx.fillStyle = "#fff";
                    health = 2 * this.health
                }
                for (let j = 0; j < 4; j++) {
                    if (health > j * 0.25) {
                        ctx.fillRect(x + (j * 0.52) * this.radius, y, w, w);
                    }
                }
            },
            status: [], 
            checkStatus() {
                let j = this.status.length;
                while (j--) {
                    this.status[j].effect();
                    if (this.status[j].endCycle < simulation.cycle) {
                        this.status[j].endEffect();
                        this.status.splice(j, 1);
                    }
                }
            },
            isSlowed: false,
            isStunned: false,
            seeAtDistance2: Infinity, 
            distanceToPlayer() {
                const dx = this.position.x - player.position.x;
                const dy = this.position.y - player.position.y;
                return Math.sqrt(dx * dx + dy * dy);
            },
            distanceToPlayer2() {
                const dx = this.position.x - player.position.x;
                const dy = this.position.y - player.position.y;
                return dx * dx + dy * dy;
            },
            gravity() {
                this.force.y += this.mass * this.g;
            },
            seePlayerFreq: Math.floor(30 + 30 * Math.random()), 
            foundPlayer() {
                this.locatePlayer();
                if (!this.seePlayer.yes) {
                    this.alertNearByMobs();
                    this.seePlayer.yes = true;
                }
            },
            lostPlayer() {
                this.seePlayer.yes = false;
                this.seePlayer.recall -= this.seePlayerFreq;
                if (this.seePlayer.recall < 0) this.seePlayer.recall = 0;
            },
            memory: 120, 
            locatePlayer() { 
                this.seePlayer.recall = this.memory + Math.round(this.memory * Math.random()); 
                this.seePlayer.position.x = player.position.x;
                this.seePlayer.position.y = player.position.y;
            },
            alertNearByMobs() {
                for (let i = 0; i < mob.length; i++) {
                    if (!mob[i].seePlayer.recall && Vector.magnitudeSquared(Vector.sub(this.position, mob[i].position)) < this.alertRange2) {
                        mob[i].locatePlayer();
                    }
                }
            },
            alwaysSeePlayer() {
                if (!m.isCloak) {
                    this.seePlayer.recall = 1;
                    this.seePlayer.position.x = player.position.x;
                    this.seePlayer.position.y = player.position.y;
                }
            },
            seePlayerByHistory(depth = 30) { 
                if (!(simulation.cycle % this.seePlayerFreq)) {
                    if (Matter.Query.ray(map, this.position, this.playerPosRandomY()).length === 0 && !m.isCloak) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                        if (!m.isCloak) {
                            for (let i = 0; i < depth; i++) { 
                                let history = m.history[(simulation.cycle - 10 * i) % 600]
                                if (Matter.Query.ray(map, this.position, history.position).length === 0) {
                                    this.seePlayer.recall = this.memory + Math.round(this.memory * Math.random()); 
                                    this.seePlayer.position.x = history.position.x;
                                    this.seePlayer.position.y = history.position.y;
                                    this.seePlayer.yes = true;
                                    break
                                }
                            }
                        }
                    }
                }
            },
            seePlayerCheck() {
                if (!(simulation.cycle % this.seePlayerFreq)) {
                    if (
                        this.distanceToPlayer2() < this.seeAtDistance2 &&
                        Matter.Query.ray(map, this.position, this.playerPosRandomY()).length === 0 &&
                        !m.isCloak
                    ) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                    }
                }
            },
            seePlayerCheckByDistance() {
                if (!(simulation.cycle % this.seePlayerFreq)) {
                    if (this.distanceToPlayer2() < this.seeAtDistance2 && !m.isCloak) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                    }
                }
            },
            seePlayerByDistOrLOS() {
                if (!(simulation.cycle % this.seePlayerFreq)) {
                    if (
                        (this.distanceToPlayer2() < this.seeAtDistance2 || (Matter.Query.ray(map, this.position, this.playerPosRandomY()).length === 0)) && 
                        !m.isCloak
                    ) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                    }
                }
            },
            isLookingAtPlayer(threshold) {
                const diff = Vector.normalise(Vector.sub(player.position, this.position));
                const dir = { x: Math.cos(this.angle), y: Math.sin(this.angle) };
                const dot = Vector.dot(dir, diff);
                if (dot > threshold) {
                    return true;
                } else {
                    return false;
                }
            },
            lookRange: 0.2 + Math.random() * 0.2,
            lookTorque: 0.0000004 * (Math.random() > 0.5 ? -1 : 1),
            seePlayerByLookingAt() {
                if (!(simulation.cycle % this.seePlayerFreq) && (this.seePlayer.recall || this.isLookingAtPlayer(this.lookRange))) {
                    if (
                        this.distanceToPlayer2() < this.seeAtDistance2 &&
                        Matter.Query.ray(map, this.position, this.playerPosRandomY()).length === 0 &&
                        !m.isCloak
                    ) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                    }
                }
                if (!this.seePlayer.recall) {
                    this.torque = this.lookTorque * this.inertia;
                    const range = Math.PI * this.lookRange;
                    ctx.beginPath();
                    ctx.arc(this.position.x, this.position.y, this.radius * 2.5, this.angle - range, this.angle + range);
                    ctx.arc(this.position.x, this.position.y, this.radius * 1.4, this.angle + range, this.angle - range, true);
                    ctx.fillStyle = "rgba(0,0,0,0.07)";
                    ctx.fill();
                }
            },
            playerPosRandomY() {
                return {
                    x: player.position.x, 
                    y: player.position.y + (Math.random() - 0.5) * 110
                };
            },
            harmZone() {
                if (this.seePlayer.yes) {
                    ctx.setLineDash([125 * Math.random(), 125 * Math.random()]);
                    if (this.distanceToPlayer() < this.laserRange) {
                        if (m.immuneCycle < m.cycle) {
                            m.takeDamage(0.0003 * this.damageScale());
                            if (m.energy > 0.1) m.energy -= 0.003
                        }
                        ctx.beginPath();
                        ctx.moveTo(this.position.x, this.position.y);
                        ctx.lineTo(m.pos.x, m.pos.y);
                        ctx.lineTo(m.pos.x + (Math.random() - 0.5) * 3000, m.pos.y + (Math.random() - 0.5) * 3000);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = "rgb(255,0,170)";
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(m.pos.x, m.pos.y, 40, 0, 2 * Math.PI);
                        ctx.fillStyle = "rgba(255,0,170,0.15)";
                        ctx.fill();
                    }
                    ctx.beginPath();
                    ctx.arc(this.position.x, this.position.y, this.laserRange * 0.9, 0, 2 * Math.PI);
                    ctx.strokeStyle = "rgba(255,0,170,0.5)";
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = "rgba(255,0,170,0.03)";
                    ctx.fill();
                }
            },
            wing(a, radius = 250, ellipticity = 0.4, dmg = 0.0003) {
                const minorRadius = radius * ellipticity
                const perp = { x: Math.cos(a), y: Math.sin(a) } 
                const where = Vector.add(this.position, Vector.mult(perp, radius + 0.8 * this.radius))

                ctx.beginPath();
                ctx.ellipse(where.x, where.y, radius, minorRadius, a, 0, 2 * Math.PI)
                ctx.fill();

                const hitPlayer = Matter.Query.ray([player], this.position, Vector.add(this.position, Vector.mult(perp, radius * 2.05)), minorRadius)
                if (hitPlayer.length && m.immuneCycle < m.cycle) {
                    m.takeDamage(dmg * this.damageScale());

                    const sub = Vector.sub(m.pos, this.position)
                    const push = Vector.mult(Vector.normalise(sub), 0.15 * player.mass)
                    Matter.Body.setVelocity(player, {
                        x: 0.9 * player.velocity.x + push.x,
                        y: 0.9 * player.velocity.y + push.y - 0.1 * player.mass
                    })
                }
            },
            searchSpring() {
                ctx.beginPath();
                ctx.moveTo(this.cons.pointA.x, this.cons.pointA.y)
                ctx.lineTo(this.cons.bodyB.position.x, this.cons.bodyB.position.y)
                ctx.moveTo(this.cons2.pointA.x, this.cons2.pointA.y)
                ctx.lineTo(this.cons2.bodyB.position.x, this.cons2.bodyB.position.y)
                ctx.lineWidth = 1;
                ctx.strokeStyle = "#222";
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.cons.pointA.x, this.cons.pointA.y, 6, 0, 2 * Math.PI);
                ctx.arc(this.cons2.pointA.x, this.cons2.pointA.y, 6, 0, 2 * Math.PI);
                ctx.fillStyle = "#222";
                ctx.fill();

                if (!(simulation.cycle % this.seePlayerFreq)) {
                    if (
                        (this.seePlayer.recall || this.isLookingAtPlayer(this.lookRange)) &&
                        this.distanceToPlayer2() < this.seeAtDistance2 &&
                        Matter.Query.ray(map, this.position, player.position).length === 0 &&
                        Matter.Query.ray(body, this.position, player.position).length === 0 &&
                        !m.isCloak
                    ) {
                        this.foundPlayer();
                    } else if (this.seePlayer.recall) {
                        this.lostPlayer();
                    }
                }
            },
            springAttack() {
                const stepRange = 600
                if (this.seePlayer.recall && Matter.Query.ray(map, this.position, this.seePlayer.position).length === 0) {
                    if (!(simulation.cycle % (this.seePlayerFreq * 2))) {
                        const unit = Vector.normalise(Vector.sub(this.seePlayer.position, this.position))
                        const goal = Vector.add(this.position, Vector.mult(unit, stepRange))
                        this.springTarget.x = goal.x;
                        this.springTarget.y = goal.y;
                        this.cons.length = -200;
                        this.cons2.length = 100 + 1.5 * this.radius;
                    } else if (!(simulation.cycle % this.seePlayerFreq)) {
                        const unit = Vector.normalise(Vector.sub(this.seePlayer.position, this.position))
                        const goal = Vector.add(this.position, Vector.mult(unit, stepRange))
                        this.springTarget2.x = goal.x;
                        this.springTarget2.y = goal.y;
                        this.cons.length = 100 + 1.5 * this.radius;
                        this.cons2.length = -200;
                    }
                } else {
                    this.torque = this.lookTorque * this.inertia;
                    const range = Math.PI * this.lookRange;
                    ctx.beginPath();
                    ctx.arc(this.position.x, this.position.y, this.radius * 2.5, this.angle - range, this.angle + range);
                    ctx.arc(this.position.x, this.position.y, this.radius * 1.4, this.angle + range, this.angle - range, true);
                    ctx.fillStyle = "rgba(0,0,0,0.07)";
                    ctx.fill();
                    if (!(simulation.cycle % (this.seePlayerFreq * 4))) {
                        best = {
                            x: null,
                            y: null,
                            dist2: Infinity,
                            who: null,
                            v1: null,
                            v2: null
                        };
                        const seeRange = 3000;
                        const look = {
                            x: this.position.x + seeRange * Math.cos(this.angle),
                            y: this.position.y + seeRange * Math.sin(this.angle)
                        };
                        best = vertexCollision(this.position, look, [map, body]);
                        if (best.dist2 != Infinity) {
                            if (Math.random() > 0.5) {
                                this.springTarget.x = best.x;
                                this.springTarget.y = best.y;
                                this.cons.length = 100 + 1.5 * this.radius;
                                this.cons2.length = 100 + 1.5 * this.radius;
                            } else {
                                this.springTarget2.x = best.x;
                                this.springTarget2.y = best.y;
                                this.cons.length = 100 + 1.5 * this.radius;
                                this.cons2.length = 100 + 1.5 * this.radius;
                            }
                        }
                    }
                }
            },
            curl(range = 1000, mag = -10) {
                applyCurl = function (center, array, isAntiGravity = true) {
                    for (let i = 0; i < array.length; ++i) {
                        if (!array[i].isNotHoldable) {
                            const sub = Vector.sub(center, array[i].position)
                            const radius2 = Vector.magnitudeSquared(sub);

                            if (radius2 < range * range && radius2 > 10000) {
                                const curlVector = Vector.mult(Vector.perp(Vector.normalise(sub)), mag)
                                if (array[i].isMobBullet) {
                                    Matter.Body.setVelocity(array[i], {
                                        x: array[i].velocity.x * 0.97 + curlVector.x * 0.06,
                                        y: array[i].velocity.y * 0.97 + curlVector.y * 0.06
                                    })
                                } else {
                                    Matter.Body.setVelocity(array[i], {
                                        x: array[i].velocity.x * 0.95 + curlVector.x * 0.06,
                                        y: array[i].velocity.y * 0.95 + curlVector.y * 0.06
                                    })
                                }
                                if (isAntiGravity) array[i].force.y -= 0.8 * simulation.g * array[i].mass
                            }
                        }
                    }
                }
                applyCurl(this.position, mob, false);
                applyCurl(this.position, body);
                applyCurl(this.position, powerUp);

            },
            pullPlayer() {
                if (this.seePlayer.yes && Vector.magnitudeSquared(Vector.sub(this.position, player.position)) < 1000000) {
                    const angle = Math.atan2(player.position.y - this.position.y, player.position.x - this.position.x);
                    player.force.x -= simulation.accelScale * 0.00113 * player.mass * Math.cos(angle) * (m.onGround ? 2 : 1);
                    player.force.y -= simulation.accelScale * 0.00084 * player.mass * Math.sin(angle);

                    ctx.beginPath();
                    ctx.moveTo(this.position.x, this.position.y);
                    ctx.lineTo(m.pos.x, m.pos.y);
                    ctx.lineWidth = Math.min(60, this.radius * 2);
                    ctx.strokeStyle = "rgba(0,0,0,0.5)";
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(m.pos.x, m.pos.y, 40, 0, 2 * Math.PI);
                    ctx.fillStyle = "rgba(0,0,0,0.3)";
                    ctx.fill();
                }
            },
            repelBullets() {
                for (let i = 0, len = bullet.length; i < len; ++i) {
                    const dx = bullet[i].position.x - this.position.x;
                    const dy = bullet[i].position.y - this.position.y;
                    const dist = Math.max(300, Math.sqrt(dx * dx + dy * dy))
                    if (dist < 700) {
                        ctx.moveTo(this.position.x, this.position.y);
                        ctx.lineTo(bullet[i].position.x, bullet[i].position.y);
                        const angle = Math.atan2(dy, dx);
                        const mag = (500 * bullet[i].mass * simulation.g) / dist;
                        bullet[i].force.x += mag * Math.cos(angle);
                        bullet[i].force.y += mag * Math.sin(angle);
                    }
                }
            },
            attraction() {
                if (this.seePlayer.recall) {
                    const force = Vector.mult(Vector.normalise(Vector.sub(this.seePlayer.position, this.position)), this.accelMag * this.mass)
                    this.force.x += force.x;
                    this.force.y += force.y;
                }
            },
            repulsionRange: 500000, 
            repulsion() {
                if (this.seePlayer.recall && this.distanceToPlayer2() < this.repulsionRange) {
                    const forceMag = this.accelMag * this.mass;
                    const angle = Math.atan2(this.seePlayer.position.y - this.position.y, this.seePlayer.position.x - this.position.x);
                    this.force.x -= 2 * forceMag * Math.cos(angle);
                    this.force.y -= 2 * forceMag * Math.sin(angle); 
                }
            },
            hoverOverPlayer() {
                if (this.seePlayer.recall) {
                    const rangeY = 250;
                    if (this.position.y > this.seePlayer.position.y - this.hoverElevation + rangeY) {
                        this.force.y -= this.accelMag * this.mass;
                    } else if (this.position.y < this.seePlayer.position.y - this.hoverElevation - rangeY) {
                        this.force.y += this.accelMag * this.mass;
                    }
                    const rangeX = 150;
                    if (this.position.x > this.seePlayer.position.x + this.hoverXOff + rangeX) {
                        this.force.x -= this.accelMag * this.mass;
                    } else if (this.position.x < this.seePlayer.position.x + this.hoverXOff - rangeX) {
                        this.force.x += this.accelMag * this.mass;
                    }
                }
            },
            grow() {
                if (this.seePlayer.recall) {
                    if (this.radius < 80) {
                        const scale = 1.01;
                        Matter.Body.scale(this, scale, scale);
                        this.radius *= scale;
                        this.fill = `hsl(144, ${this.radius}%, 50%)`;
                        if (this.isShielded) { 
                            this.isShielded = false;
                            this.removeConsBB();
                        }
                    }
                } else {
                    if (this.radius > 15) {
                        const scale = 0.99;
                        Matter.Body.scale(this, scale, scale);
                        this.radius *= scale;
                        this.fill = `hsl(144, ${this.radius}%, 50%)`;
                    }
                }
            },
            search() {
                if (!this.seePlayer.recall) {
                    const newTarget = function (that) {
                        if (Math.random() < 0.0007) {
                            that.searchTarget = player.position; 
                        } else {
                            that.searchTarget = map[Math.floor(Math.random() * (map.length - 1))].position;
                        }
                    };

                    const sub = Vector.sub(this.searchTarget, this.position);
                    if (Vector.magnitude(sub) > this.radius * 2) {
                        this.force = Vector.mult(Vector.normalise(sub), this.accelMag * this.mass * 0.2);
                    } else {
                        newTarget(this);
                    }
                    if (!(simulation.cycle % (this.seePlayerFreq * 15))) {
                        newTarget(this);
                    }
                }
            },
            blink() {
                if (this.seePlayer.recall && !(simulation.cycle % this.blinkRate)) {
                    ctx.beginPath();
                    ctx.moveTo(this.position.x, this.position.y);
                    const dist = Vector.sub(this.seePlayer.position, this.position);
                    const distMag = Vector.magnitude(dist);
                    const unitVector = Vector.normalise(dist);
                    const rando = (Math.random() - 0.5) * 50;
                    if (distMag < this.blinkLength) {
                        Matter.Body.translate(this, Vector.mult(unitVector, distMag + rando));
                    } else {
                        Matter.Body.translate(this, Vector.mult(unitVector, this.blinkLength + rando));
                    }
                    ctx.lineTo(this.position.x, this.position.y);
                    ctx.lineWidth = radius * 2;
                    ctx.strokeStyle = this.stroke; 
                    ctx.stroke();
                }
            },
            drift() {
                if (this.seePlayer.recall && !(simulation.cycle % this.blinkRate)) {
                    ctx.beginPath();
                    ctx.moveTo(this.position.x, this.position.y);
                    const dist = Vector.sub(this.seePlayer.position, this.position);
                    const distMag = Vector.magnitude(dist);
                    const vector = Vector.mult(Vector.normalise(dist), this.blinkLength);
                    if (distMag < this.blinkLength) {
                        Matter.Body.setPosition(this, this.seePlayer.position);
                        Matter.Body.translate(this, {
                            x: (Math.random() - 0.5) * 50,
                            y: (Math.random() - 0.5) * 50
                        });
                    } else {
                        vector.x += (Math.random() - 0.5) * 200;
                        vector.y += (Math.random() - 0.5) * 200;
                        Matter.Body.translate(this, vector);
                    }
                    ctx.lineTo(this.position.x, this.position.y);
                    ctx.lineWidth = radius * 2;
                    ctx.strokeStyle = this.stroke;
                    ctx.stroke();
                }
            },
            bomb() {
                if (
                    !(simulation.cycle % this.fireFreq) &&
                    Math.abs(this.position.x - this.seePlayer.position.x) < 400 && 
                    Matter.Query.ray(map, this.position, this.playerPosRandomY()).length === 0 && 
                    Matter.Query.ray(body, this.position, this.playerPosRandomY()).length === 0
                ) {
                    spawn.bomb(this.position.x, this.position.y + this.radius * 0.7, 9 + Math.ceil(this.radius / 15), 5);
                    Matter.Body.setAngularVelocity(mob[mob.length - 1], (Math.random() - 0.5) * 0.5);
                    Matter.Body.setVelocity(mob[mob.length - 1], { x: this.velocity.x, y: this.velocity.y });
                    Matter.Body.setAngularVelocity(this, (Math.random() - 0.5) * 0.25);
                }
            },
            fire() {
                const setNoseShape = () => {
                    const mag = this.radius + this.radius * this.noseLength;
                    this.vertices[1].x = this.position.x + Math.cos(this.angle) * mag;
                    this.vertices[1].y = this.position.y + Math.sin(this.angle) * mag;
                };
                if (this.seePlayer.recall) {
                    if (!(simulation.cycle % this.seePlayerFreq)) {
                        this.fireDir = Vector.normalise(Vector.sub(this.seePlayer.position, this.position));
                        this.fireDir.y -= Math.abs(this.seePlayer.position.x - this.position.x) / 2500; 
                    }
                    const angle = this.angle + Math.PI / 2;
                    const dot = Vector.dot({
                        x: Math.cos(angle),
                        y: Math.sin(angle)
                    }, this.fireDir)
                    const threshold = 0.1;
                    if (dot > threshold) {
                        this.torque += 0.000004 * this.inertia;
                    } else if (dot < -threshold) {
                        this.torque -= 0.000004 * this.inertia;
                    } else if (this.noseLength > 1.5 && dot > -0.2 && dot < 0.2) {
                        spawn.bullet(this.vertices[1].x, this.vertices[1].y, this.tier, 9 + Math.ceil(this.radius / 15));

                        const v = 15;
                        Matter.Body.setVelocity(mob[mob.length - 1], {
                            x: this.velocity.x + this.fireDir.x * v + 3 * Math.random(),
                            y: this.velocity.y + this.fireDir.y * v + 3 * Math.random()
                        });
                        this.noseLength = 0;
                        this.force.x -= 0.005 * this.fireDir.x * this.mass;
                        this.force.y -= 0.005 * this.fireDir.y * this.mass;
                    }
                    if (this.noseLength < 1.5) this.noseLength += this.fireFreq;
                    setNoseShape();
                } else if (this.noseLength > 0.1) {
                    this.noseLength -= this.fireFreq / 2;
                    setNoseShape();
                }
            },
            turnToFacePlayer() {
                const dx = player.position.x - this.position.x;
                const dy = -player.position.y + this.position.y;
                const dist = this.distanceToPlayer();
                const angle = this.angle + Math.PI / 2;
                c = Math.cos(angle) * dx - Math.sin(angle) * dy;
                if (c > 0.04 * dist) {
                    this.torque += 0.002 * this.mass;
                } else if (c < 0.04) {
                    this.torque -= 0.002 * this.mass;
                }
            },
            facePlayer() {
                const unitVector = Vector.normalise(Vector.sub(this.seePlayer.position, this.position));
                const angle = Math.atan2(unitVector.y, unitVector.x);
                Matter.Body.setAngle(this, angle - Math.PI);
            },
            explode(mass = this.mass) {
                if (m.immuneCycle < m.cycle) {
                    m.takeDamage(Math.min(Math.max(0.03 * Math.sqrt(mass), 0.01), 0.4) * this.damageScale());
                    this.isDropPowerUp = false;
                    this.death(); 
                }
            },
            timeLimit() {
                this.timeLeft--;
                if (this.timeLeft < 0) {
                    this.isDropPowerUp = false;
                    this.death(); 
                }
            },
            damageScale() {
                return ((spawn.mobDmgDoneByTier[this.tier] && level.levelsCleared < 14) ? spawn.mobDmgDoneByTier[this.tier] : spawn.dmgToPlayerByLevelsCleared())
            },
            damage(dmg, isBypassShield = false) { 
                if ((!this.isShielded || isBypassShield) && this.alive) {

                        dmg *= tech.damageAdjustments()
                        if (this.isDropPowerUp) {
                            if (this.health === 1) {

                                    dmg *= 2.11
                                    simulation.ephemera.push({
                                        count: 7,

                                        do() {

                                            if (this.count < 0) simulation.removeEphemera(this)
                                            ctx.beginPath();
                                            const vertices = this.vertices;
                                            ctx.moveTo(vertices[0].x, vertices[0].y);
                                            for (let j = 1, len = vertices.length; j < len; ++j) {
                                                ctx.lineTo(vertices[j].x, vertices[j].y);
                                            }

                                            ctx.fillStyle = `rgba(255,0,100,0.15)` 
                                            ctx.fill()
                                            ctx.lineWidth = 3 
                                            ctx.strokeStyle = `#f08` 
                                            ctx.stroke();
                                        },
                                    })
                                }
                                if (tech.isChatter && !this.isInvulnerable) {
                                    let isTalking = false
                                    for (let i = 0; i < simulation.ephemera.length; i++) {
                                        if (simulation.ephemera[i].name === "in game text") {
                                            isTalking = true
                                        }
                                    }
                                    if (!isTalking) {
                                        const quotes = [
                                            "I can do *anything!*",
                                            "Chaos, chaos!",
                                            "Let's make the devilskn-",
                                            "Darmok and Jaled at Tanagra",

                                            "I see the light... it's a [404 Error]!",
                                            "I wish i took those digeridoo lessons",
                                            "Your mother was a hamster, and your father smelt of elderberries",
                                            "In Rod we trust",
                                            "AAAAAAAA",

                                            "hey Mr M? are you still mad at me?",

                                            "yippee",

                                            "WE CALLED TO TALK ABOUT YOUR CAR'S LIMITED WARRANTY",
                                            "KAMEHAMEHA!!!!!!!!!!",

                                            "you know, I really dislike you.",
                                            "Good luck, and may the odds be ever in your favor",
                                            "You dare defy the Lord of Darkness."
                                        ];
                                        const color = `#${Math.floor(Math.random() * 76 + 180).toString(16)}${Math.floor(Math.random() * 121).toString(16).padStart(2, '0')}${Math.floor(Math.random() * 121).toString(16).padStart(2, '0')}`
                                        const quote = quotes[Math.floor(Math.random() * quotes.length)]
                                        level.inGameText(this.position.x, this.position.y - 50, quote, 240, color)
                                    }
                                }
                            } else if (tech.isMobLowHealth && this.health < 0.25) {
                                dmg *= 3
                                simulation.ephemera.push({
                                    count: 2, 
                                    vertices: this.vertices,
                                    do() {
                                        this.count--
                                        if (this.count < 0) simulation.removeEphemera(this)
                                        ctx.beginPath();
                                        const vertices = this.vertices;
                                        ctx.moveTo(vertices[0].x, vertices[0].y);
                                        for (let j = 1, len = vertices.length; j < len; ++j) {
                                            ctx.lineTo(vertices[j].x, vertices[j].y);
                                        }
                                        ctx.lineTo(vertices[0].x, vertices[0].y);
                                        ctx.fillStyle = `rgba(255,50,100,0.2)` 
                                        ctx.fill()
                                        ctx.lineWidth = 3 
                                        ctx.strokeStyle = `#f38` 
                                        ctx.stroke();
                                    },
                                })
                            }
                        }

                        if (this.tier && level.levelsCleared < 14) {
                            dmg *= spawn.mobDmgTakenByTier[this.tier] 
                        } else {
                            dmg *= spawn.mobDmgTakenByLevelsCleared() 
                        }
                        dmg *= this.damageReduction 

                        if (tech.isFarAwayDmg) dmg *= 1 + Math.sqrt(Math.max(500, Math.min(3000, this.distanceToPlayer())) - 500) * 0.0067 
                        if (tech.energySiphon && this.isDropPowerUp && m.immuneCycle < m.cycle) {
                            const regen = Math.min(this.health, dmg) * tech.energySiphon * level.isReducedRegen
                            if (!isNaN(regen) && regen !== Infinity) {
                                m.energy += regen 
                                simulation.energyGenGraphic(3 + Math.min(20, Math.floor(400 * regen)))
                            }
                        }
                        dmg /= Math.sqrt(this.mass)
                    }

                    this.health -= dmg
                    this.onDamage(dmg); 
                    if ((this.health < 0.01 || isNaN(this.health)) && this.alive) this.death();
                }
            },
            onDamage() {
            },
            onDeath() {
            },
            damageReduction: 1,
            leaveBody: true,
            maxMobBody: 40,
            isDropPowerUp: true,
            death() {
                if (tech.collidePowerUps && this.isDropPowerUp) powerUps.randomize(this.position) 
                this.onDeath(this); 
                this.removeConsBB();
                this.alive = false; 

                if (this.isDropPowerUp) {

                        for (let i = 0; i < mob.length; i++) {

                                    if (mob[i].health > 1) mob[i].health = 1

                                        time: 10
                                    });

                                if (!simulation.paused && !simulation.isChoosing) {

                            }
                        }
                        requestAnimationFrame(cycle);

                    }
                    if (tech.deathSpawnsFromBoss || tech.deathSpawns) {

                        const len = Math.min(12, spawns * Math.ceil(Math.random() * simulation.difficulty * spawns))

                            Matter.Body.setVelocity(mob[mob.length - 1], {
                                x: this.velocity.x + (Math.random() - 0.5) * 10,
                                y: this.velocity.x + (Math.random() - 0.5) * 10
                            });
                        }
                    }
                    if (level.isMobRespawn && !this.isBoss && 0.25 > Math.random()) {

                            color: `#fff`,
                            time: 40
                        });
                        simulation.drawList.push({
                            x: this.position.x,
                            y: this.position.y,
                            radius: 10,
                            color: `#fff`,
                            time: 60
                        });

                            spawn.randomMobByLevelsCleared(this.position.x, this.position.y);

                        simulation.drawList.push({

                            y: this.position.y,

                            color: "#0eb",

                            y: this.position.y,

                            color: "#0eb",
                            time: 6
                        });

                            y: this.position.y,
                            radius: 200,
                            color: "#0eb",

                        });

                        }

                        requestAnimationFrame(() => {
                            simulation.timePlayerSkip(this.isBoss ? 60 : 30)
                            simulation.loop();

                        if (m.energy < 0) m.energy = 0
                    }

                        tech.mineralLastCheck = simulation.cycle
                        tech.mineralDamageReduction = 1 - (1 - tech.mineralDamageReduction) * Math.pow(0.9, seconds);
                        tech.mineralDamage = 1 + (tech.mineralDamage - 1) * Math.pow(0.9, seconds);
                        tech.mineralDamageReduction *= 0.85
                    }
                    if (tech.isDemineralize) {
                        const seconds = (simulation.cycle - tech.mineralLastCheck) / 60
                        tech.mineralLastCheck = simulation.cycle
                        tech.mineralDamageReduction = 1 - (1 - tech.mineralDamageReduction) * Math.pow(0.9, seconds);
                        tech.mineralDamage = 1 + (tech.mineralDamage - 1) * Math.pow(0.9, seconds);
                        tech.mineralDamage *= 1.08
                    }



                    powerUps.spawnRandomPowerUp(this.position.x, this.position.y);

                            for (let i = 0; i < len; i++) b.worm(this.position)

                        }

                                tech.wire.segments.push({ x: last.x, y: last.y, oldX: last.x, oldY: last.y });

                                closestRadius = radius
                                closestIndex = i
                            }

                        if (closestIndex) {

                            ctx.beginPath();
                            ctx.moveTo(this.position.x, this.position.y);

                            ctx.strokeStyle = "rgba(0,80,80,1)";

                    }
                }
            },
            removeConsBB() {
                for (let i = 0, len = consBB.length; i < len; ++i) {
                    if (consBB[i].bodyA === this) {
                        if (consBB[i].bodyB.shield) { 
                            consBB[i].bodyB.do = function () { this.death() }
                        }
                        consBB[i].bodyA = consBB[i].bodyB;
                        consBB.splice(i, 1);
                        this.removeConsBB();
                        break;
                    } else if (consBB[i].bodyB === this) {
                        if (consBB[i].bodyA.shield) {
                            consBB[i].bodyA.do = function () { this.death() }
                        }
                        consBB[i].bodyB = consBB[i].bodyA;
                        consBB.splice(i, 1);
                        this.removeConsBB();
                        break;
                    }
                }
            },
            removeCons() {
                for (let i = 0, len = cons.length; i < len; ++i) {
                    if (cons[i].bodyA === this) {
                        cons[i].bodyA = cons[i].bodyB;
                        cons.splice(i, 1);
                        this.removeCons();
                        break;
                    } else if (cons[i].bodyB === this) {
                        cons[i].bodyB = cons[i].bodyA;
                        cons.splice(i, 1);
                        this.removeCons();
                        break;
                    }
                }
            },
            replace(i) {
                if (this.leaveBody && body.length < mobs.maxMobBody && this.mass < 200 && this.mass > 1 && this.radius > 18) {

                    let v = Matter.Vertices.hull(Matter.Vertices.clockwiseSort(this.vertices))

                        const cutPoint = 3 + Math.floor((v.length - 6) * Math.random()) 
                        const v2 = v.slice(0, cutPoint + 1)
                        v = v.slice(cutPoint - 1)
                        const len = body.length;
                        body[len] = Matter.Bodies.fromVertices(this.position.x, this.position.y, v2);
                        Matter.Body.setVelocity(body[len], Vector.mult(this.velocity, 0.5));
                        Matter.Body.setAngularVelocity(body[len], this.angularVelocity);
                        body[len].collisionFilter.category = cat.body;
                        body[len].collisionFilter.mask = cat.player | cat.map | cat.body | cat.bullet | cat.mob | cat.mobBullet;
                        body[len].classType = "body";
                        body[len].frictionAir = 0.001
                        body[len].friction = 0.05
                        Composite.add(engine.world, body[len]); 

                        const len2 = body.length;
                        body[len2] = Matter.Bodies.fromVertices(this.position.x, this.position.y, v);
                        Matter.Body.setVelocity(body[len2], Vector.mult(this.velocity, 0.5));
                        Matter.Body.setAngularVelocity(body[len2], this.angularVelocity);
                        body[len2].collisionFilter.category = cat.body;
                        body[len2].collisionFilter.mask = cat.player | cat.map | cat.body | cat.bullet | cat.mob | cat.mobBullet;
                        body[len2].classType = "body";
                        body[len2].frictionAir = 0.001
                        body[len2].friction = 0.05
                        Composite.add(engine.world, body[len2]); 

                        if (body[len].mass + body[len2].mass > 16) {
                            const massLimit = 8 + 6 * Math.random()
                            const shrink = function (that1, that2) {
                                if (that1.mass + that2.mass > massLimit) {
                                    const scale = 0.95;
                                    Matter.Body.scale(that1, scale, scale);
                                    Matter.Body.scale(that2, scale, scale);
                                    setTimeout(shrink, 20, that1, that2);
                                }
                            };
                            shrink(body[len], body[len2])
                        }
                    } else {
                        const len = body.length;
                        body[len] = Matter.Bodies.fromVertices(this.position.x, this.position.y, v);
                        Matter.Body.setVelocity(body[len], Vector.mult(this.velocity, 0.5));
                        Matter.Body.setAngularVelocity(body[len], this.angularVelocity);
                        body[len].collisionFilter.category = cat.body;
                        body[len].collisionFilter.mask = cat.player | cat.map | cat.body | cat.bullet | cat.mob | cat.mobBullet;
                        body[len].classType = "body";
                        body[len].frictionAir = 0.001
                        body[len].friction = 0.05
                        Composite.add(engine.world, body[len]); 
                        if (body[len].mass > 9) {

                            const shrink = function (that) {

                                    const scale = 0.95;
                                    Matter.Body.scale(that, scale, scale);
                                    setTimeout(shrink, 20, that);
                                }
                            };
                            shrink(body[len])
                        }
                    }
                    Matter.Composite.remove(engine.world, this);
                    mob.splice(i, 1);
                    if (tech.isMobBlockFling) {
                        const who = body[body.length - 1]
                        if (!who.isNotHoldable) {

                            Matter.Body.setAngularVelocity(who, (0.5 + 0.2 * Math.random()) * (Math.random() < 0.5 ? -1 : 1));
                        }
                    }
                } else {
                    Matter.Composite.remove(engine.world, this);
                    mob.splice(i, 1);
                }
            }
        });
        mob[i].alertRange2 = Math.pow(mob[i].radius * 3 + 550, 2);
        Composite.add(engine.world, mob[i]); 
    }
};

const HISTORY_LEN = 600;
function initHistory(pos) {
    const h = new Array(HISTORY_LEN);
    for (let i = 0; i < HISTORY_LEN; i++) h[i] = { position: { x: pos.x, y: pos.y } };
    return h;
}
function safeIndex(i) { return ((i % HISTORY_LEN) + HISTORY_LEN) % HISTORY_LEN; }
function makeHistoryProxy(arr) {
    return new Proxy(arr, {
        get(target, prop) {
            if (typeof prop === "string" && /^-?\d+$/.test(prop)) return target[safeIndex(parseInt(prop, 10))];
            return target[prop];
        }
    });
}
function updateAllHistories() {
    for (let i = 0; i < mob.length; i++) {
        const me = mob[i];
        if (!me._huntMemory) me._huntMemory = initHistory(me.position);
        const slot = me._huntMemory[simulation.cycle % HISTORY_LEN];
        slot.position.x = me.position.x;
        slot.position.y = me.position.y;
    }
}

let currentActingTeam = null;
let currentActingMob = null;

function livingEnemiesOf(team) {
    const out = [];
    for (let i = 0; i < mob.length; i++) {
        const cand = mob[i];
        if (cand.alive && cand.team !== team) out.push(cand);
    }
    return out;
}

function nearestMobTeam(x, y, excludeMob) {
    let best = null, bestDist = Infinity;
    for (let i = 0; i < mob.length; i++) {
        const cand = mob[i];
        if (cand === excludeMob || !cand.alive) continue;
        const dx = cand.position.x - x, dy = cand.position.y - y;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = cand; }
    }
    return best ? best.team : "A";
}

const _originalMobsSpawn = mobs.spawn;
mobs.spawn = function (xPos, yPos, sides, radius, color) {
    _originalMobsSpawn(xPos, yPos, sides, radius, color);
    const created = mob[mob.length - 1];
    created.team = currentActingTeam !== null ? currentActingTeam : nearestMobTeam(xPos, yPos, created);
};

function findNearestEnemy(me) {
    let best = null, bestDist = Infinity;
    for (let i = 0; i < mob.length; i++) {
        const cand = mob[i];
        if (cand === me || !cand.alive || cand.team === me.team || cand.collisionFilter.category === cat.mobShield) continue;
        const dx = cand.position.x - me.position.x, dy = cand.position.y - me.position.y;
        const d = dx * dx + dy * dy;
        if (d < bestDist) { bestDist = d; best = cand; }
    }
    return best;
}

function pointGlobalsAt(target) {
    player = target;
    playerBody = target;
    playerHead = target;
    m._target = target;
}

function resolveTargetFor(me) {
    pointGlobalsAt(findNearestEnemy(me) || NO_TARGET);
}

function runMobAI() {
    updateAllHistories();
    let i = mob.length;
    while (i--) {
        if (mob[i].alive) {
            currentActingTeam = mob[i].team;
            currentActingMob = mob[i];
            resolveTargetFor(mob[i]);
            mob[i].do();
            currentActingTeam = null;
            currentActingMob = null;
        } else {
            mob[i].replace(i);
        }
    }
}

                this.radius = 148 * tech.isDarkStar + 370 * (1 + 0.1 * sine)
